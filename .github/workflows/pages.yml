# เผยแพร่เฉพาะโฟลเดอร์ app/ ขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
# docs/ tools/ taxonomy/ อยู่ใน repo แต่ไม่ขึ้นเว็บแอป
name: Deploy app to Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # กันพลาดชั้นสุดท้าย: ห้ามมีไฟล์หน่วยแบบไม่เข้ารหัสในสิ่งที่จะเผยแพร่
      - name: Block unencrypted unit data
        run: |
          if find app -name 'unit.dev.json' -o -name 'unit_cases*.json' -o -name 'history.dev.json' \
               -o -name 'history.json' -o -name 'regs.dev.json' -o -name 'rpp*' -o -name 'himg' \
               -o -name 'pap.dev.json' -o -name 'pap.json' -o -name 'papimg' | grep -q .; then
            echo "พบไฟล์หน่วยแบบไม่เข้ารหัสใน app/ — หยุดการเผยแพร่"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
